# The Supabase Free plan pauses a project after a week without requests, which takes logins and the
# leaderboard offline. A read of the public leaderboard twice a week keeps it awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the public leaderboard
        run: |
          url=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/lib/supabase.ts | head -1)
          key=$(grep -oE "eyJ[A-Za-z0-9._-]+" src/lib/supabase.ts | head -1)
          curl -fsS -X POST "$url/rest/v1/rpc/season1_standings" \
            -H "apikey: $key" -H "Authorization: Bearer $key" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase answered."
