# On every push to main: tests, builds the site (hash URLs, relative paths) and publishes it with its API
# (functions/, database D1) to Cloudflare Pages. GitHub Pages can't run the API, so it only gets a page that
# sends visitors (and old links, hash included) to https://the-four-exiles.pages.dev.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:static
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
      # The GitHub Pages copy is just a redirect; the hash (#/missions…) goes along, so old links still work.
      - name: Redirect page for GitHub Pages
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>The Four Exiles</title>
          <link rel="canonical" href="https://the-four-exiles.pages.dev/">
          <meta http-equiv="refresh" content="0; url=https://the-four-exiles.pages.dev/">
          <script>location.replace('https://the-four-exiles.pages.dev/' + location.hash);</script>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#f5f5f7;font:16px/1.5 system-ui,sans-serif}a{color:#f5f5f7}</style>
          </head>
          <body>
          <p>The Four Exiles moved to <a href="https://the-four-exiles.pages.dev/">the-four-exiles.pages.dev</a>. · O site mudou para <a href="https://the-four-exiles.pages.dev/">the-four-exiles.pages.dev</a>.</p>
          </body>
          </html>
          HTML
          cp redirect/index.html redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The real site: dist/ plus functions/ (the API) and wrangler.toml (the D1 binding), project the-four-exiles.
  # Database changes are not applied here: run `npx wrangler d1 migrations apply four-exiles --remote` first.
  # Skipped until the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist, and on any branch
  # other than main (a manual run on another branch must never overwrite the live site).
  cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.161.0 pages deploy dist --project-name the-four-exiles --branch main --commit-hash ${{ github.sha }}
